services:
  backend:
    image: ghcr.io/jsansop/speedtest-logger:latest
    build: .
    container_name: speedtest-backend
    command: ["uv", "run", "python", "main.py"]
    ports:
      - "5000:5000"
    volumes:
      - speedtest_data:/app/data
    shm_size: '512mb'
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HEARTBEAT_URL=${HEARTBEAT_URL:-}
    restart: unless-stopped

volumes:
  speedtest_data:
