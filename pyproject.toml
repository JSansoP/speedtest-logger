[project]
name = "speedtest-logger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "apscheduler>=3.11.2",
    "croniter>=6.2.2",
    "flasgger>=0.9.7",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "icmplib>=3.0.4",
    "python-telegram-bot>=22.7",
    "sqlalchemy>=2.0.48",
    "tzdata>=2025.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
