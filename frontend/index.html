<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speedtest Logger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315191b'/%3E%3Cpath d='M7 22a9 9 0 0 1 18 0' fill='none' stroke='%23fbfcfb' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 22l5-7' stroke='%233987e5' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="static/vendor/archivo-latin-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/vendor/uPlot.min.css">
  <link rel="stylesheet" href="static/app.css">
  <script>
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="home-link" href="http://personal-vps/home/" title="Back to the home dashboard"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 8 2.5l5.5 5v6h-11z"/></svg>Home</a>
      <a class="brand" href="#/dashboard">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 22a9 9 0 0 1 18 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M16 22l5-7" stroke="var(--dl)" stroke-width="2.5" stroke-linecap="round"/></svg>
        Speedtest Logger
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#/dashboard" data-view="dashboard">Dashboard</a>
        <a href="#/latency" data-view="latency">Latency</a>
        <a href="#/history" data-view="history">History</a>
        <a href="#/reports" data-view="reports">Reports</a>
        <a href="#/settings" data-view="settings">Settings</a>
      </nav>
      <div class="runner">
        <span class="runner-status" id="runner-status" aria-live="polite"></span>
        <button class="button primary" id="run-button" type="button">Run test</button>
      </div>
    </div>
    <div class="progress" id="progress" hidden></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="static/vendor/uPlot.iife.min.js"></script>
  <script type="module" src="static/app.js"></script>
</body>
</html>
