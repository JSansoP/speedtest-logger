# Serves Speedtest Logger at /speedtest/ from the openMediaVault nginx (port 80).
# Install: sudo cp speedtest.conf /etc/nginx/openmediavault-webgui.d/ && sudo nginx -t && sudo systemctl reload nginx

location = /speedtest {
    return 301 /speedtest/;
}

location /speedtest/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /speedtest;
    proxy_read_timeout 60s;
}
